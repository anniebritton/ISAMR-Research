[project]
name = "wapusk-greenup"
version = "0.1.0"
description = "Spring green-up timing and its climate drivers in Wapusk National Park, 2001-2024"
readme = "README.md"
license = "MIT"
authors = [{ name = "Annie Britton" }]
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pymannkendall>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
    "typer>=0.12",
    "pyproj>=3.7.2",
]

[project.optional-dependencies]
appendix = ["windrose>=1.9", "jupyter>=1.0"]

[project.scripts]
wapusk = "wapusk_greenup.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "nbstripout>=0.7", "pre-commit>=3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wapusk_greenup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gee: hits the real Earth Engine backend (needs credentials and WAPUSK_GEE_PROJECT)"]
addopts = "-m 'not gee'"
